<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — AOJ Document Control Portal</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="nav-slot"></div>

  <section class="project-hero" id="phero">
    <div class="ph-inner"><div class="loading"><span class="spinner"></span></div></div>
  </section>

  <section class="section" style="padding-top:36px;">
    <div style="margin-bottom:24px; max-width:560px;">
      <div class="search-wrap">
        <span class="search-icon" id="searchIcon"></span>
        <input id="projSearch" class="search-input" placeholder="Search within this project…"
               style="padding:14px 18px 14px 48px; font-size:14.5px;">
        <div id="searchResults" class="search-results"></div>
      </div>
    </div>
    <div id="accordion" class="accordion"></div>
  </section>

  <!-- Access request modal -->
  <div class="modal-bg" id="reqModal">
    <div class="modal">
      <div class="modal-head">
        <h3>Request access to Confidential documents</h3>
        <button class="icon-btn" onclick="closeReq()">${''}</button>
      </div>
      <div class="modal-body">
        <p style="color:var(--muted); margin:0 0 16px; font-size:14px;">
          An administrator will review your request. You'll be notified by email once access is granted.
        </p>
        <div class="field">
          <label>Category</label>
          <input id="reqCat" disabled>
        </div>
        <div class="field">
          <label>Reason for access (optional)</label>
          <textarea id="reqNote" placeholder="e.g. Need to review Contract Vol. 2 for VE proposal"></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="closeReq()">Cancel</button>
        <button class="btn btn-primary" id="reqSubmit">Submit Request</button>
      </div>
    </div>
  </div>

  <div id="foot-slot"></div>
  <script src="/assets/app.js"></script>
  <script>
    document.getElementById('nav-slot').innerHTML = renderNav('projects');
    document.getElementById('foot-slot').innerHTML = renderFooter();
    document.getElementById('searchIcon').innerHTML = ICONS.search;
    document.querySelector('#reqModal .modal-head .icon-btn').innerHTML = ICONS.x;
    refreshAuthArea();

    const slug = location.pathname.split('/').filter(Boolean).pop();
    let project = null, categories = null, me = null;

    (async () => {
      me = await apiGet('me');
      const r = await apiGet('project', { slug });
      if (r.error) {
        document.body.innerHTML = `<div class="empty" style="padding:120px;">
          <h3>Project not found</h3><p><a href="/projects">← Back to projects</a></p></div>`;
        return;
      }
      project = r.project; categories = r.categories;
      renderHero();
      renderAccordion();
    })();

    function renderHero() {
      const p = project;
      document.getElementById('phero').innerHTML = `
        <div class="ph-inner">
          <div class="crumbs">
            <a href="/">Home</a><span class="sep">·</span>
            <a href="/projects">Projects</a><span class="sep">·</span>
            <span>${escapeHtml(p.name)}</span>
          </div>
          <div class="ph-title-row">
            <div>
              ${p.reference ? `<div class="pcard-ref" style="margin-bottom:8px;">${escapeHtml(p.reference)}</div>` : ''}
              <h1>${escapeHtml(p.name)}</h1>
              <div class="pcard-loc" style="margin-top:10px;">${ICONS.location} ${escapeHtml(p.location || '')}</div>
            </div>
            <span class="pcard-badge badge-${p.status}" style="position:static;">${p.status}</span>
          </div>
          <div class="ph-meta">
            ${p.client      ? `<div><b>Client</b><span>${escapeHtml(p.client)}</span></div>` : ''}
            ${p.consultant  ? `<div><b>Consultant</b><span>${escapeHtml(p.consultant)}</span></div>` : ''}
            ${p.engineer    ? `<div><b>Engineer</b><span>${escapeHtml(p.engineer)}</span></div>` : ''}
            ${p.pmc         ? `<div><b>PMC</b><span>${escapeHtml(p.pmc)}</span></div>` : ''}
            ${p.developer || p.master_developer ? `<div><b>Developer</b><span>${escapeHtml(p.developer || p.master_developer)}</span></div>` : ''}
            ${p.value       ? `<div><b>Contract Value</b><span>${escapeHtml(p.value)}</span></div>` : ''}
            ${p.duration    ? `<div><b>Duration</b><span>${escapeHtml(p.duration)}</span></div>` : ''}
          </div>
        </div>`;
    }

    function renderAccordion() {
      const sections = [
        { key: 'confidential', icon: ICONS.lockBig, title: 'Confidential Documents',
          desc: 'Contracts, letters and RFIs — requires authorized Google account.', locked: true },
        { key: 'logs', icon: ICONS.logs, title: 'Logs',
          desc: 'Master logs, WIR/MIR, RFI, RTS and correspondence trackers.', locked: false },
        { key: 'softcopies', icon: ICONS.files, title: 'Soft Copies',
          desc: 'Tender drawings, BOQ, IFC, shop drawings, submittals and reports.', locked: false },
      ];
      document.getElementById('accordion').innerHTML = sections.map((s, i) => {
        const cats = categories[s.key] || [];
        return `
          <details class="acc-item ${s.locked ? 'locked' : ''}" ${i === 0 ? 'open' : ''}>
            <summary class="acc-head">
              <div class="acc-icon-wrap">${s.icon}</div>
              <div class="acc-title">
                <h3>${escapeHtml(s.title)} ${s.locked ? `<span style="color:var(--brand); display:inline-flex;">${ICONS.lock}</span>` : ''}</h3>
                <p>${escapeHtml(s.desc)}</p>
              </div>
              <div class="acc-count">${cats.length}</div>
              <div class="acc-caret">${ICONS.chevron}</div>
            </summary>
            <div class="acc-body"><div class="acc-body-inner">
              ${renderCategories(s, cats)}
            </div></div>
          </details>`;
      }).join('');
    }

    function renderCategories(section, cats) {
      if (!cats.length) return `<div class="empty" style="padding:24px;"><p>No categories yet — an admin can add them.</p></div>`;
      const authed = me?.connected;
      const canOpenConf = me?.role === 'admin' || me?.approved;

      return `<div class="cat-grid">${cats.map(c => {
        const hasLink = !!c.drive_url;
        const restricted = section.key === 'confidential' && !canOpenConf;

        if (restricted) {
          return `<button class="cat-btn locked" onclick="openReq('${c._id}', ${JSON.stringify(c.name).slice(1,-1)}, '${section.key}')">
            <div class="ico">${ICONS.lock}</div>
            <div class="body"><b>${escapeHtml(c.name)}</b><small>${authed ? 'Request access' : 'Sign in required'}</small></div>
            <div class="go">${ICONS.chevron}</div>
          </button>`;
        }
        if (!hasLink) {
          return `<button class="cat-btn unmapped" title="Not yet mapped">
            <div class="ico">${section.key === 'logs' ? ICONS.sheet : ICONS.folder}</div>
            <div class="body"><b>${escapeHtml(c.name)}</b><small>Not yet mapped</small></div>
          </button>`;
        }
        return `<a class="cat-btn" href="${escapeHtml(c.drive_url)}" target="_blank" rel="noopener">
          <div class="ico">${c.drive_type === 'sheet' ? ICONS.sheet : (c.drive_type === 'file' ? ICONS.file : ICONS.folder)}</div>
          <div class="body"><b>${escapeHtml(c.name)}</b><small>Open in Google Drive</small></div>
          <div class="go">${ICONS.open}</div>
        </a>`;
      }).join('')}</div>`;
    }

    // Access request modal
    let currentReq = null;
    function openReq(catId, catName, section) {
      if (!me?.connected) { location.href = API + '?action=oauth_start&return=' + encodeURIComponent(location.pathname); return; }
      currentReq = { categoryId: catId, section };
      document.getElementById('reqCat').value = catName;
      document.getElementById('reqNote').value = '';
      document.getElementById('reqModal').classList.add('open');
    }
    function closeReq() { document.getElementById('reqModal').classList.remove('open'); }
    window.openReq = openReq; window.closeReq = closeReq;
    document.getElementById('reqSubmit').addEventListener('click', async () => {
      if (!currentReq) return;
      const r = await apiPost('request_access', {
        projectId: project._id,
        categoryId: currentReq.categoryId,
        section: currentReq.section,
        note: document.getElementById('reqNote').value,
      });
      if (r.ok) { toast(r.existing ? 'You already have a pending request for this.' : 'Access request submitted.'); closeReq(); }
      else toast(r.error || 'Failed', 'err');
    });

    attachSearch(document.getElementById('projSearch'), document.getElementById('searchResults'));
  </script>
</body>
</html>
