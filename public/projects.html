<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — AOJ Document Control Portal</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="nav-slot"></div>

  <section class="section">
    <div class="section-head">
      <div>
        <div class="section-eyebrow">Portfolio</div>
        <h2>All Projects</h2>
        <p>Filter by status or search by name and location.</p>
      </div>
      <div class="filter-bar" id="filterBar">
        <button class="chip active" data-f="all">All</button>
        <button class="chip" data-f="ongoing">Ongoing</button>
        <button class="chip" data-f="tender">Tender</button>
        <button class="chip" data-f="completed">Completed</button>
      </div>
    </div>
    <div style="margin-bottom:24px; max-width:460px;">
      <input id="q" class="search-input" placeholder="Filter by name or location…" style="padding:12px 18px; font-size:14px;">
    </div>
    <div class="projects-grid" id="grid">
      <div class="loading" style="grid-column:1/-1;"><span class="spinner"></span></div>
    </div>
  </section>

  <div id="foot-slot"></div>
  <script src="/assets/app.js"></script>
  <script>
    document.getElementById('nav-slot').innerHTML = renderNav('projects');
    document.getElementById('foot-slot').innerHTML = renderFooter();

    let all = [], filter = 'all';

    (async () => {
      const me = await requireAuth(); if (!me) return;
      refreshAuthArea();
      const r = await apiGet('projects');
      all = r.projects || []; render();
    })();
    const grid = document.getElementById('grid'), q = document.getElementById('q');

    function render() {
      const t = q.value.trim().toLowerCase();
      const list = all.filter(p =>
        (filter === 'all' || p.status === filter) &&
        (!t || (p.name||'').toLowerCase().includes(t) || (p.location||'').toLowerCase().includes(t))
      );
      grid.innerHTML = list.length ? list.map(projectCard).join('') : `<div class="empty" style="grid-column:1/-1;">No projects match.</div>`;
    }
    q.addEventListener('input', render);
    document.getElementById('filterBar').addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      document.querySelectorAll('#filterBar .chip').forEach(c => c.classList.remove('active'));
      b.classList.add('active'); filter = b.dataset.f; render();
    });
  </script>
</body>
</html>
