<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — AOJ Document Control Portal</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow">
  <link rel="stylesheet" href="/assets/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .login-wrap { min-height: calc(100vh - 71px); display: grid; place-items: center; padding: 40px 20px; background: var(--bg); }
    .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 40px; width: 100%; max-width: 420px; box-shadow: var(--shadow-lg); }
    .login-card h2 { margin: 0 0 6px; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .login-card .sub { color: var(--muted); font-size: 14px; margin-bottom: 26px; }
    .login-err { background: var(--brand-soft); color: var(--brand); padding: 10px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; margin-bottom: 16px; display: none; }
    .login-err.on { display: block; }
    .login-or { text-align: center; color: var(--muted); font-size: 12px; margin: 20px 0; position: relative; }
    .login-or::before, .login-or::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: var(--border); }
    .login-or::before { left: 0; } .login-or::after { right: 0; }
  </style>
</head>
<body>
  <div id="nav-slot"></div>

  <div id="root"><div class="loading"><span class="spinner"></span></div></div>

  <div class="modal-bg" id="modal">
    <div class="modal" id="modalBox"></div>
  </div>

  <script src="/assets/app.js"></script>
  <script>
    document.getElementById('nav-slot').innerHTML = renderNav('');
    refreshAuthArea();

    let projectsCache = [];

    // Entry point: check current user
    (async () => {
      const me = await apiGet('me');
      if (me.connected && me.role === 'admin') { renderPanel(); }
      else { renderLogin(); }

      const qp = new URLSearchParams(location.search);
      if (qp.get('drive') === 'connected') { setTimeout(() => toast('Google Drive connected.'), 300); history.replaceState({}, '', '/admin'); }
      if (qp.get('err')) { setTimeout(() => toast(qp.get('err'), 'err'), 300); history.replaceState({}, '', '/admin'); }
    })();

    // ── Login screen ─────────────────────────────────────────────────────
    function renderLogin() {
      document.getElementById('root').innerHTML = `
        <div class="login-wrap"><div class="login-card">
          <div style="width:52px; height:52px; border-radius:12px; background:linear-gradient(135deg,var(--brand),var(--brand-2)); display:grid; place-items:center; color:#fff; margin-bottom:18px;">${ICONS.shield}</div>
          <h2>Admin Sign In</h2>
          <p class="sub">Enter your master credentials to open the admin panel.</p>
          <div class="login-err" id="loginErr"></div>
          <div class="field">
            <label>Username</label>
            <input id="lUser" autocomplete="username" placeholder="username">
          </div>
          <div class="field">
            <label>Password</label>
            <input id="lPass" type="password" autocomplete="current-password" placeholder="••••••••">
          </div>
          <button class="btn btn-primary btn-lg" id="lBtn" style="width:100%;">Sign in to Admin</button>
          <div class="login-or">OR</div>
          <a class="btn btn-ghost" href="${API}?action=oauth_start&return=/admin" style="width:100%;">${ICONS.google} Sign in with Google (admin account)</a>
          <div style="text-align:center; margin-top:18px;"><a href="/" style="color:var(--muted); font-size:13px;">← Back to portal</a></div>
        </div></div>`;
      const u = document.getElementById('lUser'), p = document.getElementById('lPass'), err = document.getElementById('loginErr');
      const submit = async () => {
        err.classList.remove('on');
        const btn = document.getElementById('lBtn');
        btn.disabled = true; btn.textContent = 'Signing in…';
        const r = await apiPost('admin_login', { username: u.value, password: p.value });
        if (r.ok) { location.reload(); }
        else { err.textContent = r.error || 'Login failed'; err.classList.add('on'); btn.disabled = false; btn.textContent = 'Sign in to Admin'; }
      };
      document.getElementById('lBtn').addEventListener('click', submit);
      [u, p].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); }));
      u.focus();
    }

    // ── Admin panel ──────────────────────────────────────────────────────
    function renderPanel() {
      document.getElementById('root').innerHTML = `
        <div class="admin-layout">
          <aside class="admin-side">
            <h4>Manage</h4>
            <div class="admin-nav">
              <a data-tab="dash" class="active">📊 Dashboard</a>
              <a data-tab="drive">🔗 Google Drive</a>
              <a data-tab="files">📂 File Manager</a>
              <a data-tab="projects">🏗 Projects</a>
              <a data-tab="categories">📁 Categories</a>
              <a data-tab="users">👥 Users</a>
              <a data-tab="requests">🔑 Access Requests</a>
              <a data-tab="audit">📜 Audit Log</a>
            </div>
            <h4>Session</h4>
            <div class="admin-nav">
              <a href="/">← Back to portal</a>
              <a onclick="signOut()" style="color:var(--brand); cursor:pointer;">🚪 Sign out</a>
            </div>
          </aside>
          <main class="admin-main" id="main">
            <div class="loading"><span class="spinner"></span></div>
          </main>
        </div>`;
      document.querySelectorAll('.admin-nav a[data-tab]').forEach(a => {
        a.addEventListener('click', () => {
          document.querySelectorAll('.admin-nav a[data-tab]').forEach(x => x.classList.remove('active'));
          a.classList.add('active');
          showTab(a.dataset.tab);
        });
      });
      showTab('dash');
    }

    async function signOut() { await apiGet('logout'); location.reload(); }
    window.signOut = signOut;

    async function safeCall(fn, m) {
      try { await fn(); }
      catch (e) {
        console.error(e);
        m.innerHTML = `<div class="empty" style="padding:60px;"><h3>Something went wrong</h3><p>${escapeHtml(e.message || 'Failed to load')}</p><button class="btn btn-primary" onclick="location.reload()" style="margin-top:14px;">Reload</button></div>`;
      }
    }

    async function showTab(tab) {
      const m = document.getElementById('main');
      m.innerHTML = `<div class="loading"><span class="spinner"></span></div>`;
      const fns = { dash: renderDash, drive: renderDrive, files: renderFiles, projects: renderProjects, categories: renderCategories, users: renderUsers, requests: renderRequests, audit: renderAudit };
      await safeCall(() => fns[tab](m), m);
    }

    // ── Dashboard ────────────────────────────────────────────────────────
    async function renderDash(m) {
      const s = await apiGet('admin_stats');
      if (s.error) throw new Error(s.error);
      const drive = s.drive || { connected: false };
      const driveBanner = drive.connected
        ? `<div style="background:var(--ongoing-bg); border:1px solid color-mix(in oklab, var(--ongoing) 30%, transparent); border-radius:var(--radius); padding:16px 20px; margin-bottom:24px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
             <div style="width:40px; height:40px; border-radius:50%; background:var(--ongoing); color:#fff; display:grid; place-items:center;">${ICONS.check}</div>
             <div style="flex:1;"><b>Google Drive connected</b><br><small style="color:var(--muted);">Serving files from <b>${escapeHtml(drive.email || '—')}</b></small></div>
             <button class="btn btn-ghost btn-sm" onclick="goTab('drive')">Manage</button>
           </div>`
        : `<div style="background:var(--brand-soft); border:1px solid var(--brand); border-radius:var(--radius); padding:16px 20px; margin-bottom:24px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
             <div style="width:40px; height:40px; border-radius:50%; background:var(--brand); color:#fff; display:grid; place-items:center;">!</div>
             <div style="flex:1;"><b>Google Drive not connected</b><br><small style="color:var(--muted);">The portal cannot serve any documents until you connect a Drive account.</small></div>
             <a class="btn btn-primary btn-sm" href="${API}?action=oauth_start&admin_drive=1">${ICONS.google} Connect Drive</a>
           </div>`;
      m.innerHTML = `
        <div class="admin-h"><div>
          <h1>Dashboard</h1>
          <p>Overview of your Document Control Portal.</p>
        </div></div>
        ${driveBanner}
        <div class="kpis">
          <div class="kpi"><div class="l">Active Projects</div><div class="v">${s.projects || 0}</div></div>
          <div class="kpi"><div class="l">Categories Mapped</div><div class="v">${s.categories || 0}</div></div>
          <div class="kpi"><div class="l">Registered Users</div><div class="v">${s.users || 0}</div></div>
          <div class="kpi"><div class="l">Pending Requests</div><div class="v" style="color:var(--brand);">${s.pending_requests || 0}</div></div>
          <div class="kpi"><div class="l">Actions (24h)</div><div class="v">${s.actions_24h || 0}</div></div>
        </div>
        <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:24px;">
          <h3 style="margin-top:0;">Quick actions</h3>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn btn-primary" onclick="editProject()">+ New Project</button>
            <button class="btn btn-ghost" onclick="goTab('categories')">Map Drive Links</button>
            <button class="btn btn-ghost" onclick="goTab('requests')">Review Requests</button>
          </div>
        </div>`;
    }

    // ── Drive Connection ────────────────────────────────────────────────
    async function renderDrive(m) {
      const r = await apiGet('admin_drive_status');
      if (r.connected) {
        m.innerHTML = `
          <div class="admin-h"><div><h1>Google Drive Connection</h1><p>The single shared Drive that powers the whole portal.</p></div></div>
          <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:28px; margin-bottom:20px;">
            <div style="display:flex; align-items:center; gap:16px; margin-bottom:20px;">
              ${r.photo ? `<img src="${r.photo}" referrerpolicy="no-referrer" style="width:56px; height:56px; border-radius:50%;">` : ''}
              <div>
                <div style="font-size:11.5px; font-weight:700; color:var(--ongoing); text-transform:uppercase; letter-spacing:.08em;">✓ Connected</div>
                <h2 style="margin:4px 0 4px; font-size:22px;">${escapeHtml(r.name || r.email)}</h2>
                <div style="color:var(--muted); font-size:13.5px;">${escapeHtml(r.email)}</div>
              </div>
            </div>
            <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; padding:16px 0; border-top:1px solid var(--border); border-bottom:1px solid var(--border);">
              <div><div style="font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;">Storage used</div><b>${escapeHtml(r.storage?.used || '—')}</b></div>
              <div><div style="font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;">Storage limit</div><b>${escapeHtml(r.storage?.limit || '—')}</b></div>
              <div><div style="font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px;">Connected on</div><b>${r.connected_at ? new Date(r.connected_at).toLocaleString() : '—'}</b></div>
            </div>
            <div style="margin-top:20px; display:flex; gap:10px; flex-wrap:wrap;">
              <a class="btn btn-ghost" href="${API}?action=oauth_start&admin_drive=1">${ICONS.google} Reconnect / switch account</a>
              <button class="btn btn-danger" onclick="disconnectDrive()">Disconnect</button>
            </div>
            ${r.error ? `<p style="color:var(--brand); margin-top:16px; font-size:13.5px;">⚠ ${escapeHtml(r.error)}</p>` : ''}
          </div>
          <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px; color:var(--muted); font-size:13.5px;">
            <b style="color:var(--text);">How this works:</b>
            <ul style="margin:10px 0 0; padding-left:20px; line-height:1.7;">
              <li>Every search and every document link in the whole portal is served from this Drive.</li>
              <li>Public visitors do <b>not</b> need to sign in — they see all non-confidential files instantly.</li>
              <li>Files in Confidential folders are marked <b>Restricted</b> and can only be opened by users you approve under Users.</li>
              <li>To switch Drive accounts, click "Reconnect" and sign in with a different Google account.</li>
            </ul>
          </div>`;
      } else {
        m.innerHTML = `
          <div class="admin-h"><div><h1>Google Drive Connection</h1><p>Connect a Google Drive to power the portal.</p></div></div>
          <div style="background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:40px; text-align:center;">
            <div style="width:72px; height:72px; margin:0 auto 20px;">${ICONS.google}</div>
            <h2 style="margin:0 0 8px; font-size:22px;">Connect the master Google Drive</h2>
            <p style="color:var(--muted); max-width:520px; margin:0 auto 24px;">
              Sign in with the Google account that owns (or has access to) all AOJ project folders.
              This is a <b>one-time</b> step — every visitor will search and open files through this account.
            </p>
            <a class="btn btn-primary btn-lg" href="${API}?action=oauth_start&admin_drive=1">${ICONS.google} Sign in with Google</a>
            ${r.error ? `<p style="color:var(--brand); margin-top:20px; font-size:13.5px;">⚠ ${escapeHtml(r.error)}</p>` : ''}
          </div>`;
      }
    }
    // ── Drive File Manager ────────────────────────────────────────────────
    let fmFolder = { id: 'root', name: 'My Drive' };
    let fmStack = [];
    async function renderFiles(m) {
      const r = await apiGet('admin_drive_list', { folder: fmFolder.id });
      if (r.error) throw new Error(r.error);
      const items = r.items || [];
      m.innerHTML = `
        <div class="admin-h">
          <div>
            <h1>File Manager</h1>
            <p>Browse, rename, move and delete anything in the master Drive.</p>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-ghost" onclick="fmMkdir()">+ New Folder</button>
          </div>
        </div>
        <div style="margin-bottom:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:14px;">
          ${fmStack.length ? `<button class="btn btn-ghost btn-sm" onclick="fmBack()">← Back</button>` : ''}
          <span style="color:var(--muted);">Location:</span>
          <b>${escapeHtml(fmFolder.name)}</b>
          ${fmStack.length ? `<span style="color:var(--muted); font-size:12px;">(${fmStack.map(s => escapeHtml(s.name)).join(' / ')} / ${escapeHtml(fmFolder.name)})</span>` : ''}
        </div>
        <table class="data">
          <thead><tr><th>Name</th><th>Type</th><th>Size</th><th>Modified</th><th style="width:220px;"></th></tr></thead>
          <tbody>${items.map(it => `
            <tr>
              <td>
                ${it.type === 'folder'
                  ? `<a onclick='fmOpen(${JSON.stringify(it.id)}, ${JSON.stringify(it.name)})' style="cursor:pointer; color:var(--brand); font-weight:600;">📁 ${escapeHtml(it.name)}</a>`
                  : `<span>📄 ${escapeHtml(it.name)}</span>`}
              </td>
              <td style="color:var(--muted); font-size:12.5px;">${escapeHtml(it.mimeType.split('.').pop())}</td>
              <td style="color:var(--muted);">${escapeHtml(it.size || '—')}</td>
              <td style="color:var(--muted); font-size:12.5px;">${it.modified ? new Date(it.modified).toLocaleDateString() : '—'}</td>
              <td style="text-align:right; white-space:nowrap;">
                <a class="btn btn-ghost btn-sm" href="${escapeHtml(it.link)}" target="_blank">Open</a>
                <button class="btn btn-ghost btn-sm" onclick='fmRename(${JSON.stringify(it.id)}, ${JSON.stringify(it.name)})'>Rename</button>
                <button class="btn btn-danger btn-sm" onclick='fmDelete(${JSON.stringify(it.id)}, ${JSON.stringify(it.name)})'>Delete</button>
              </td>
            </tr>`).join('') || `<tr><td colspan="5" style="text-align:center; color:var(--muted); padding:32px;">Empty folder.</td></tr>`}
          </tbody>
        </table>`;
    }
    function fmOpen(id, name) { fmStack.push(fmFolder); fmFolder = { id, name }; showTab('files'); }
    function fmBack() { fmFolder = fmStack.pop() || { id: 'root', name: 'My Drive' }; showTab('files'); }
    async function fmRename(id, cur) {
      const name = prompt('Rename to:', cur); if (!name || name === cur) return;
      const r = await apiPost('admin_drive_rename', { fileId: id, name });
      if (r.error) return toast(r.error, 'err');
      toast('Renamed.'); showTab('files');
    }
    async function fmDelete(id, name) {
      if (!confirm('Move "' + name + '" to Trash? This affects the master Drive.')) return;
      const r = await apiPost('admin_drive_delete', { fileId: id });
      if (r.error) return toast(r.error, 'err');
      toast('Moved to trash.'); showTab('files');
    }
    async function fmMkdir() {
      const name = prompt('New folder name:'); if (!name) return;
      const r = await apiPost('admin_drive_mkdir', { parentId: fmFolder.id, name });
      if (r.error) return toast(r.error, 'err');
      toast('Folder created.'); showTab('files');
    }
    window.fmOpen = fmOpen; window.fmBack = fmBack; window.fmRename = fmRename; window.fmDelete = fmDelete; window.fmMkdir = fmMkdir;

    async function disconnectDrive() {
      if (!confirm('Disconnect the master Google Drive? Search and document links will stop working until you reconnect.')) return;
      const r = await apiPost('admin_drive_disconnect', {});
      if (r.error) return toast(r.error, 'err');
      toast('Drive disconnected.'); showTab('drive');
    }
    window.disconnectDrive = disconnectDrive;
    function goTab(t) { document.querySelector(`[data-tab="${t}"]`).click(); }
    window.goTab = goTab;

    // ── Projects ─────────────────────────────────────────────────────────
    async function renderProjects(m) {
      const r = await apiGet('admin_projects');
      if (r.error) throw new Error(r.error);
      projectsCache = r.projects || [];
      m.innerHTML = `
        <div class="admin-h">
          <div><h1>Projects</h1><p>Add, edit, or archive projects.</p></div>
          <button class="btn btn-primary" onclick="editProject()">+ New Project</button>
        </div>
        <table class="data">
          <thead><tr><th>Name</th><th>Reference</th><th>Location</th><th>Status</th><th>Active</th><th></th></tr></thead>
          <tbody>${projectsCache.map(p => `
            <tr>
              <td><b>${escapeHtml(p.name)}</b></td>
              <td>${escapeHtml(p.reference || '—')}</td>
              <td>${escapeHtml(p.location || '—')}</td>
              <td><span class="pcard-badge badge-${p.status}" style="position:static;">${p.status}</span></td>
              <td>${p.active ? '✓' : '—'}</td>
              <td style="text-align:right; white-space:nowrap;">
                <button class="btn btn-ghost btn-sm" onclick='editProject(${JSON.stringify(p._id)})'>Edit</button>
                <button class="btn btn-danger btn-sm" onclick='delProject(${JSON.stringify(p._id)})'>Archive</button>
              </td>
            </tr>`).join('') || '<tr><td colspan="6" style="text-align:center; color:var(--muted); padding:32px;">No projects yet — click "+ New Project" above.</td></tr>'}
          </tbody>
        </table>`;
    }
    async function editProject(id) {
      let p = { name:'', slug:'', reference:'', location:'', status:'ongoing', client:'', consultant:'', engineer:'', pmc:'', developer:'', value:'', duration:'', description:'', cover:1, drive_root:'' };
      if (id) {
        if (!projectsCache.length) { const r = await apiGet('admin_projects'); projectsCache = r.projects || []; }
        p = projectsCache.find(x => x._id === id) || p;
      }
      openModal(id ? 'Edit Project' : 'New Project', `
        <div class="field-row">
          <div class="field"><label>Slug (URL) *</label><input id="f-slug" value="${escapeHtml(p.slug||'')}" ${id?'disabled':''} placeholder="my-project"></div>
          <div class="field"><label>Reference</label><input id="f-reference" value="${escapeHtml(p.reference||'')}"></div>
        </div>
        <div class="field"><label>Project Name *</label><input id="f-name" value="${escapeHtml(p.name||'')}"></div>
        <div class="field"><label>Location</label><input id="f-location" value="${escapeHtml(p.location||'')}"></div>
        <div class="field-row">
          <div class="field"><label>Status</label><select id="f-status">
            <option value="ongoing"${p.status==='ongoing'?' selected':''}>Ongoing</option>
            <option value="tender"${p.status==='tender'?' selected':''}>Tender</option>
            <option value="completed"${p.status==='completed'?' selected':''}>Completed</option>
          </select></div>
          <div class="field"><label>Cover (1–4)</label><input id="f-cover" type="number" min="1" max="4" value="${p.cover||1}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Client</label><input id="f-client" value="${escapeHtml(p.client||'')}"></div>
          <div class="field"><label>Consultant</label><input id="f-consultant" value="${escapeHtml(p.consultant||'')}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Engineer</label><input id="f-engineer" value="${escapeHtml(p.engineer||'')}"></div>
          <div class="field"><label>PMC</label><input id="f-pmc" value="${escapeHtml(p.pmc||'')}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Value</label><input id="f-value" value="${escapeHtml(p.value||'')}"></div>
          <div class="field"><label>Duration</label><input id="f-duration" value="${escapeHtml(p.duration||'')}"></div>
        </div>
        <div class="field"><label>Description</label><textarea id="f-description">${escapeHtml(p.description||'')}</textarea></div>
        <div class="field"><label>Drive Root Folder URL (optional)</label><input id="f-drive_root" value="${escapeHtml(p.drive_root||'')}" placeholder="https://drive.google.com/drive/folders/..."></div>
      `, async () => {
        const data = {};
        ['slug','reference','name','location','status','client','consultant','engineer','pmc','developer','value','duration','description','drive_root'].forEach(k => {
          const el = document.getElementById('f-'+k); if (el) data[k] = el.disabled ? (p[k] || '') : el.value.trim();
        });
        data.cover = parseInt(document.getElementById('f-cover').value) || 1;
        if (id) data._id = id;
        if (!data.slug || !data.name) return toast('Slug and Name are required', 'err');
        const r = await apiPost('admin_project_save', data);
        if (r.error) return toast(r.error, 'err');
        toast('Project saved.'); closeModal(); showTab('projects');
      });
    }
    async function delProject(id) {
      if (!confirm('Archive this project? It will be hidden from the public site.')) return;
      const r = await apiPost('admin_project_delete', { _id: id });
      if (r.error) return toast(r.error, 'err');
      toast('Archived.'); showTab('projects');
    }
    window.editProject = editProject; window.delProject = delProject;

    // ── Categories ───────────────────────────────────────────────────────
    async function renderCategories(m) {
      if (!projectsCache.length) { const r = await apiGet('admin_projects'); projectsCache = r.projects || []; }
      if (!projectsCache.length) {
        m.innerHTML = `<div class="empty" style="padding:60px;"><h3>No projects yet</h3><p>Create a project first before adding categories.</p><button class="btn btn-primary" onclick="goTab('projects')" style="margin-top:14px;">Go to Projects</button></div>`;
        return;
      }
      let pid = localStorage.getItem('adm-pid');
      if (!pid || !projectsCache.find(p => p._id === pid)) pid = projectsCache[0]._id;
      const r = await apiGet('admin_categories', { projectId: pid });
      if (r.error) throw new Error(r.error);
      const groups = { confidential: [], logs: [], softcopies: [] };
      (r.categories || []).forEach(c => { if (groups[c.section]) groups[c.section].push(c); });
      m.innerHTML = `
        <div class="admin-h">
          <div><h1>Categories &amp; Drive Links</h1><p>Map each category button to a Google Drive folder, file, or Sheet URL.</p></div>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <select id="pickProj" style="padding:10px 14px; border-radius:9px; border:1px solid var(--border); background:var(--surface); color:var(--text); font-family:inherit;">
              ${projectsCache.map(p => `<option value="${p._id}"${p._id===pid?' selected':''}>${escapeHtml(p.name)}</option>`).join('')}
            </select>
            <button class="btn btn-primary" onclick="editCat()">+ Add Category</button>
          </div>
        </div>
        ${['confidential','logs','softcopies'].map(sec => `
          <h3 style="margin:24px 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700;">${sec}</h3>
          <table class="data" style="margin-bottom:12px;">
            <thead><tr><th>Name</th><th>Type</th><th>Drive URL</th><th style="width:180px;"></th></tr></thead>
            <tbody>${groups[sec].map(c => `
              <tr>
                <td><b>${escapeHtml(c.name)}</b></td>
                <td>${c.drive_type || 'folder'}</td>
                <td style="max-width:400px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                  ${c.drive_url ? `<a href="${escapeHtml(c.drive_url)}" target="_blank" style="color:var(--brand);">${escapeHtml(c.drive_url)}</a>` : '<span style="color:var(--muted);">not mapped</span>'}
                </td>
                <td style="text-align:right; white-space:nowrap;">
                  <button class="btn btn-ghost btn-sm" onclick='editCat(${JSON.stringify(c._id)})'>Edit</button>
                  <button class="btn btn-danger btn-sm" onclick='delCat(${JSON.stringify(c._id)})'>Remove</button>
                </td>
              </tr>`).join('') || `<tr><td colspan="4" style="text-align:center; color:var(--muted); padding:20px;">No ${sec} categories yet.</td></tr>`}
            </tbody>
          </table>`).join('')}`;
      document.getElementById('pickProj').addEventListener('change', e => {
        localStorage.setItem('adm-pid', e.target.value);
        showTab('categories');
      });
    }
    async function editCat(id) {
      const pid = localStorage.getItem('adm-pid') || projectsCache[0]?._id;
      let c = { projectId: pid, section: 'softcopies', name: '', drive_url: '', drive_type: 'folder', sort: 0 };
      if (id) {
        const r = await apiGet('admin_categories', { projectId: pid });
        c = (r.categories || []).find(x => x._id === id) || c;
      }
      openModal(id ? 'Edit Category' : 'New Category', `
        <div class="field"><label>Name *</label><input id="c-name" value="${escapeHtml(c.name||'')}"></div>
        <div class="field-row">
          <div class="field"><label>Section</label><select id="c-section">
            <option value="confidential"${c.section==='confidential'?' selected':''}>Confidential (locked)</option>
            <option value="logs"${c.section==='logs'?' selected':''}>Logs</option>
            <option value="softcopies"${c.section==='softcopies'?' selected':''}>Soft Copies</option>
          </select></div>
          <div class="field"><label>Type</label><select id="c-type">
            <option value="folder"${c.drive_type==='folder'?' selected':''}>Folder</option>
            <option value="file"${c.drive_type==='file'?' selected':''}>File</option>
            <option value="sheet"${c.drive_type==='sheet'?' selected':''}>Sheet</option>
            <option value="doc"${c.drive_type==='doc'?' selected':''}>Doc</option>
          </select></div>
        </div>
        <div class="field"><label>Drive URL</label><input id="c-url" value="${escapeHtml(c.drive_url||'')}" placeholder="https://drive.google.com/..."></div>
        <div class="field"><label>Sort order</label><input id="c-sort" type="number" value="${c.sort||0}"></div>
      `, async () => {
        const data = {
          projectId: pid,
          name: document.getElementById('c-name').value.trim(),
          section: document.getElementById('c-section').value,
          drive_type: document.getElementById('c-type').value,
          drive_url: document.getElementById('c-url').value.trim(),
          sort: parseInt(document.getElementById('c-sort').value) || 0,
        };
        if (!data.name) return toast('Name is required', 'err');
        if (id) data._id = id;
        const r = await apiPost('admin_category_save', data);
        if (r.error) return toast(r.error, 'err');
        toast('Saved.'); closeModal(); showTab('categories');
      });
    }
    async function delCat(id) {
      if (!confirm('Remove this category?')) return;
      const r = await apiPost('admin_category_delete', { _id: id });
      if (r.error) return toast(r.error, 'err');
      toast('Removed.'); showTab('categories');
    }
    window.editCat = editCat; window.delCat = delCat;

    // ── Users ────────────────────────────────────────────────────────────
    async function renderUsers(m) {
      const r = await apiGet('admin_users');
      if (r.error) throw new Error(r.error);
      m.innerHTML = `
        <div class="admin-h">
          <div><h1>Users</h1><p>Assign roles and set confidential access level. Or grant access directly by email.</p></div>
          <button class="btn btn-primary" onclick="grantAccessModal()">+ Grant access by email</button>
        </div>
        <table class="data">
          <thead><tr><th>User</th><th>Portal role</th><th>Confidential access</th><th>Last login</th></tr></thead>
          <tbody>${(r.users || []).filter(u => u.email !== 'master-admin@aoj.local').map(u => `
            <tr>
              <td>
                <div style="display:flex; align-items:center; gap:10px;">
                  ${u.photo ? `<img src="${u.photo}" referrerpolicy="no-referrer" style="width:32px; height:32px; border-radius:50%;">` : '<div class="sr-icon" style="width:32px; height:32px;">👤</div>'}
                  <div><b>${escapeHtml(u.name || u.email)}</b><br><small style="color:var(--muted);">${escapeHtml(u.email)}</small></div>
                </div>
              </td>
              <td>
                <select onchange='updUser(${JSON.stringify(u._id)}, {role: this.value})'>
                  <option value="viewer"${u.role==='viewer'?' selected':''}>Viewer</option>
                  <option value="staff"${u.role==='staff'?' selected':''}>Staff</option>
                  <option value="admin"${u.role==='admin'?' selected':''}>Admin</option>
                </select>
              </td>
              <td>
                <select onchange='updUser(${JSON.stringify(u._id)}, {access_level: this.value, approved: this.value !== "none"})'>
                  <option value="none"${(u.access_level||'none')==='none'?' selected':''}>None</option>
                  <option value="viewer"${u.access_level==='viewer'?' selected':''}>Viewer</option>
                  <option value="editor"${u.access_level==='editor'?' selected':''}>Editor</option>
                  <option value="admin"${u.access_level==='admin'?' selected':''}>Admin</option>
                </select>
              </td>
              <td style="color:var(--muted); font-size:12.5px;">${u.last_login ? new Date(u.last_login).toLocaleString() : '—'}</td>
            </tr>`).join('') || '<tr><td colspan="4" style="text-align:center; color:var(--muted); padding:32px;">No registered users yet.</td></tr>'}
          </tbody>
        </table>`;
    }
    async function updUser(id, patch) {
      const r = await apiPost('admin_user_update', { _id: id, ...patch });
      if (r.error) return toast(r.error, 'err');
      toast('Updated.'); showTab('users');
    }
    window.updUser = updUser;

    async function grantAccessModal() {
      // Load categories for optional direct share
      if (!projectsCache.length) { const r = await apiGet('admin_projects'); projectsCache = r.projects || []; }
      const catRes = await apiGet('admin_categories');
      const cats = (catRes.categories || []).filter(c => c.section === 'confidential' && c.drive_url);
      openModal('Grant confidential access', `
        <div class="field"><label>Email *</label><input id="g-email" type="email" placeholder="user@example.com"></div>
        <div class="field"><label>Access level</label>
          <select id="g-level"><option value="viewer">Viewer</option><option value="editor">Editor</option></select>
        </div>
        <div class="field"><label>Also share a specific confidential folder/file (optional)</label>
          <select id="g-cat"><option value="">— none —</option>
            ${cats.map(c => `<option value="${c._id}">${escapeHtml((projectsCache.find(p => String(p._id) === String(c.projectId)) || {}).name || '—')} · ${escapeHtml(c.name)}</option>`).join('')}
          </select>
        </div>
        <p style="color:var(--muted); font-size:13px; margin:12px 0 0;">An email will be sent to the user confirming their new access.</p>
      `, async () => {
        const email = document.getElementById('g-email').value.trim();
        if (!email || !email.includes('@')) return toast('Valid email required', 'err');
        const r = await apiPost('admin_grant_access', {
          email, access_level: document.getElementById('g-level').value,
          categoryId: document.getElementById('g-cat').value || null,
        });
        if (r.error) return toast(r.error, 'err');
        toast('Access granted and email sent.'); closeModal(); showTab('users');
      });
    }
    window.grantAccessModal = grantAccessModal;

    // ── Access Requests ──────────────────────────────────────────────────
    async function renderRequests(m) {
      const r = await apiGet('admin_requests');
      if (r.error) throw new Error(r.error);
      m.innerHTML = `
        <div class="admin-h"><div><h1>Access Requests</h1><p>Approve or deny confidential document requests.</p></div></div>
        <table class="data">
          <thead><tr><th>Requester</th><th>Project</th><th>Category</th><th>Note</th><th>Status</th><th>Date</th><th></th></tr></thead>
          <tbody>${(r.requests || []).map(x => `
            <tr>
              <td><b>${escapeHtml(x.email)}</b></td>
              <td>${escapeHtml(x.projectId?.name || '—')}</td>
              <td>${escapeHtml(x.categoryId?.name || x.section || '—')}</td>
              <td style="max-width:280px; color:var(--muted);">${escapeHtml(x.note || '')}</td>
              <td><span class="tag st-${x.status}">${x.status}</span></td>
              <td style="color:var(--muted); font-size:12.5px;">${new Date(x.created_at).toLocaleString()}</td>
              <td style="text-align:right; white-space:nowrap;">
                ${x.status === 'pending' ? `
                  <button class="btn btn-primary btn-sm" onclick='decide(${JSON.stringify(x._id)}, "viewer")'>Viewer</button>
                  <button class="btn btn-ghost btn-sm" onclick='decide(${JSON.stringify(x._id)}, "editor")'>Editor</button>
                  <button class="btn btn-danger btn-sm" onclick='decide(${JSON.stringify(x._id)}, "denied")'>Reject</button>` : ''}
              </td>
            </tr>`).join('') || '<tr><td colspan="7" style="text-align:center; color:var(--muted); padding:32px;">No access requests.</td></tr>'}
          </tbody>
        </table>`;
    }
    async function decide(id, decision) {
      const r = await apiPost('admin_request_decide', { _id: id, decision });
      if (r.error) return toast(r.error, 'err');
      toast('Request ' + decision + '.'); showTab('requests');
    }
    window.decide = decide;

    // ── Audit Log ────────────────────────────────────────────────────────
    async function renderAudit(m) {
      const r = await apiGet('admin_audit');
      if (r.error) throw new Error(r.error);
      m.innerHTML = `
        <div class="admin-h"><div><h1>Audit Log</h1><p>Last 200 recorded actions.</p></div></div>
        <table class="data">
          <thead><tr><th>Time</th><th>User</th><th>Role</th><th>Action</th><th>Target</th><th>IP</th></tr></thead>
          <tbody>${(r.audit || []).map(a => `
            <tr>
              <td style="color:var(--muted); font-size:12.5px;">${new Date(a.created_at).toLocaleString()}</td>
              <td><b>${escapeHtml(a.email || '—')}</b></td>
              <td>${a.role ? `<span class="tag role-${a.role}">${a.role}</span>` : '—'}</td>
              <td><code>${escapeHtml(a.action)}</code></td>
              <td style="color:var(--muted); font-size:12px;">${escapeHtml(a.target || '')}</td>
              <td style="color:var(--muted); font-size:12px;">${escapeHtml(a.ip || '—')}</td>
            </tr>`).join('') || '<tr><td colspan="6" style="text-align:center; color:var(--muted); padding:32px;">No activity yet.</td></tr>'}
          </tbody>
        </table>`;
    }

    // ── Modal ────────────────────────────────────────────────────────────
    function openModal(title, bodyHtml, onSave) {
      const box = document.getElementById('modalBox');
      box.innerHTML = `
        <div class="modal-head"><h3>${escapeHtml(title)}</h3><button class="icon-btn" onclick="closeModal()">${ICONS.x}</button></div>
        <div class="modal-body">${bodyHtml}</div>
        <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="modalSave">Save</button></div>`;
      document.getElementById('modalSave').onclick = onSave;
      document.getElementById('modal').classList.add('open');
    }
    function closeModal() { document.getElementById('modal').classList.remove('open'); }
    window.closeModal = closeModal;
  </script>
</body>
</html>
